<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.5-9B on the BC250: 24 versus 40 compute units</title>
<desc id="desc">At six inference threads, prompt processing improves from 204.41 to 316.97 tokens per second; generation improves from 36.37 to 52.17. Each panel uses its own scale.</desc>
<rect width="960" height="370" rx="18" fill="#101923"/>
<g font-family="system-ui,Segoe UI,sans-serif" fill="#edf3f8">
<text x="32" y="42" font-size="23" font-weight="700">BC250 · the measured 40-CU gain</text>
<text x="32" y="70" font-size="14" fill="#b5c4d0">Qwen3.5-9B Q4_K_M · Vulkan · 6 inference threads · 3 repetitions</text>
<text x="32" y="114" font-size="17" font-weight="600">Prompt processing · 512 tokens</text>
<text x="512" y="114" font-size="17" font-weight="600">Output generation · 128 tokens</text>
<text x="32" y="159" font-size="14">24 CU</text><rect x="95" y="136" width="210" height="34" rx="5" fill="#6c8298"/>
<text x="313" y="159" font-size="14">204.41</text>
<text x="32" y="211" font-size="14">40 CU</text><rect x="95" y="188" width="326" height="34" rx="5" fill="#46d2ad"/>
<text x="329" y="211" font-size="14" fill="#10251e" font-weight="700">316.97</text>
<text x="512" y="159" font-size="14">24 CU</text><rect x="575" y="136" width="227" height="34" rx="5" fill="#6c8298"/>
<text x="810" y="159" font-size="14">36.37</text>
<text x="512" y="211" font-size="14">40 CU</text><rect x="575" y="188" width="326" height="34" rx="5" fill="#46d2ad"/>
<text x="815" y="211" font-size="14" fill="#10251e" font-weight="700">52.17</text>
<text x="32" y="271" font-size="28" font-weight="700" fill="#46d2ad">+55% prefill</text>
<text x="512" y="271" font-size="28" font-weight="700" fill="#46d2ad">+43% generation</text>
<text x="32" y="316" font-size="13" fill="#b5c4d0">Tokens/sec · independent panel scales · one board · September 28, 2026</text>
<text x="32" y="340" font-size="13" fill="#b5c4d0">Short local benchmarks. See the methodology and raw samples before comparing results.</text>
</g></svg>